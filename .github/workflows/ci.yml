name: CI

on:
  push:
    branches: [main, master, development]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test/optional backends
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[postgres,s3,ldap]" pytest
      - name: Run test suite
        run: pytest -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      # Notebooks render from stored outputs (nb_execution_mode = "off"), so the
      # docs build needs no analysis stack and no chisurf.
      - name: Build docs (warnings are errors)
        run: sphinx-build -W -b html docs docs/_build/html
