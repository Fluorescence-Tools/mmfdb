# 02 · Chained steps — the output of one tool feeds the next.
#
# select the high-FRET bursts, then histogram them. The runner orders steps by
# their data dependencies (`histogram` consumes `select.selected`), so the
# provenance graph is raw -> select -> histogram.
version: 1
name: chained
description: Filter a burst table, then histogram the surviving bursts.

sources:
  bursts:
    path: data/bursts.csv
    kind: burst_table

steps:
  - id: select
    operation_type: burst_selection
    software: {package: select_bursts, version: "1.0"}
    inputs: {table: bursts}
    params: {min_proximity_ratio: 0.5}
    cmd: >
      python {workflow_dir}/tools/select_bursts.py {inputs.table}
      --column proximity_ratio --min {params.min_proximity_ratio}
      --output {outputs.selected}
    outputs:
      selected: {kind: burst_table, path: selected.csv}

  - id: histogram
    operation_type: analysis
    software: {package: histogram, version: "1.0"}
    inputs: {table: select.selected}     # <- chained on the previous step's output
    params: {bins: 10}
    cmd: >
      python {workflow_dir}/tools/histogram.py {inputs.table}
      --column proximity_ratio --bins {params.bins} --output {outputs.hist}
    outputs:
      hist: {kind: processed_data, path: histogram.csv}

publish:
  seed: bursts                            # export the whole lineage from the raw node
  formats: [report, bundle]
