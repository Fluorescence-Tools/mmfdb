<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- card -->
  <rect x="8" y="8" width="904" height="454" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="36" y="48" font-size="22" font-weight="700" fill="#0f172a">MMFDB — from raw photons to a traceable, depositable result</text>
  <text x="36" y="72" font-size="14" fill="#64748b">A content-addressed store, an mmCIF-derived schema, and a provenance graph — embedded or as an HTTP / JSON-RPC service.</text>

  <!-- pipeline stages -->
  <!-- stage 1 -->
  <rect x="36" y="100" width="190" height="118" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="52" y="128" font-size="15" font-weight="700" fill="#1d4ed8">1 · Measure</text>
  <text x="52" y="152" font-size="12.5" fill="#334155">TTTR photon streams,</text>
  <text x="52" y="170" font-size="12.5" fill="#334155">confocal / FLIM images —</text>
  <text x="52" y="188" font-size="12.5" fill="#334155">or simulate with a</text>
  <text x="52" y="206" font-size="12.5" fill="#334155">known ground truth.</text>

  <!-- stage 2 -->
  <rect x="256" y="100" width="190" height="118" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="272" y="128" font-size="15" font-weight="700" fill="#15803d">2 · Store</text>
  <text x="272" y="152" font-size="12.5" fill="#334155">Content-addressed</text>
  <text x="272" y="170" font-size="12.5" fill="#334155">object store — native</text>
  <text x="272" y="188" font-size="12.5" fill="#334155">files kept as-is,</text>
  <text x="272" y="206" font-size="12.5" fill="#334155">deduplicated by hash.</text>

  <!-- stage 3 -->
  <rect x="476" y="100" width="190" height="118" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="492" y="128" font-size="15" font-weight="700" fill="#c2410c">3 · Analyse</text>
  <text x="492" y="152" font-size="12.5" fill="#334155">Any tool — tttrlib,</text>
  <text x="492" y="170" font-size="12.5" fill="#334155">FRETBursts, a CLI,</text>
  <text x="492" y="188" font-size="12.5" fill="#334155">your own script. Every</text>
  <text x="492" y="206" font-size="12.5" fill="#334155">run is recorded.</text>

  <!-- stage 4 -->
  <rect x="696" y="100" width="188" height="118" rx="12" fill="#faf5ff" stroke="#e9d5ff"/>
  <text x="712" y="128" font-size="15" font-weight="700" fill="#7e22ce">4 · Deposit</text>
  <text x="712" y="152" font-size="12.5" fill="#334155">Self-contained ZIP:</text>
  <text x="712" y="170" font-size="12.5" fill="#334155">native data + mmCIF</text>
  <text x="712" y="188" font-size="12.5" fill="#334155">+ provenance →</text>
  <text x="712" y="206" font-size="12.5" fill="#334155">Zenodo / OSF.</text>

  <!-- arrows between stages -->
  <g fill="#94a3b8">
    <path d="M226 159 l24 0 l0 -6 l12 9 l-12 9 l0 -6 l-24 0 z"/>
    <path d="M446 159 l24 0 l0 -6 l12 9 l-12 9 l0 -6 l-24 0 z"/>
    <path d="M666 159 l24 0 l0 -6 l12 9 l-12 9 l0 -6 l-24 0 z"/>
  </g>

  <!-- provenance strip -->
  <rect x="36" y="256" width="848" height="120" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="52" y="284" font-size="14" font-weight="700" fill="#0f172a">Provenance graph</text>
  <text x="868" y="284" font-size="12.5" fill="#64748b" text-anchor="end">every result traces back to the raw photons and the exact tool</text>

  <!-- nodes: raw -> op(s) -> results -->
  <!-- raw -->
  <rect x="60" y="304" width="150" height="46" rx="10" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="135" y="326" font-size="12.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">raw measurement</text>
  <text x="135" y="342" font-size="11" fill="#3b82f6" text-anchor="middle">object + checksum</text>

  <!-- op A -->
  <rect x="360" y="286" width="170" height="40" rx="10" fill="#ffedd5" stroke="#fdba74"/>
  <text x="445" y="305" font-size="12" font-weight="600" fill="#9a3412" text-anchor="middle">operation: tttrlib</text>
  <text x="445" y="319" font-size="10.5" fill="#c2410c" text-anchor="middle">software · version · params</text>
  <!-- op B -->
  <rect x="360" y="330" width="170" height="40" rx="10" fill="#ffedd5" stroke="#fdba74"/>
  <text x="445" y="349" font-size="12" font-weight="600" fill="#9a3412" text-anchor="middle">operation: FRETBursts</text>
  <text x="445" y="363" font-size="10.5" fill="#c2410c" text-anchor="middle">software · version · params</text>

  <!-- results -->
  <rect x="680" y="286" width="150" height="40" rx="10" fill="#dcfce7" stroke="#86efac"/>
  <text x="755" y="310" font-size="12" font-weight="600" fill="#166534" text-anchor="middle">result / bursts</text>
  <rect x="680" y="330" width="150" height="40" rx="10" fill="#dcfce7" stroke="#86efac"/>
  <text x="755" y="354" font-size="12" font-weight="600" fill="#166534" text-anchor="middle">result / bursts</text>

  <!-- edges -->
  <g stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#ah)">
    <path d="M210 322 C 290 316, 300 306, 358 306"/>
    <path d="M210 330 C 290 344, 300 350, 358 350"/>
    <path d="M530 306 C 600 306, 610 306, 678 306"/>
    <path d="M530 350 C 600 350, 610 350, 678 350"/>
  </g>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- footer -->
  <text x="36" y="408" font-size="12.5" fill="#475569">
    <tspan font-weight="700" fill="#0f172a">Embedded</tspan> (SQLite / PostgreSQL, no server)  ·  or a standalone <tspan font-weight="700" fill="#0f172a">HTTP + JSON-RPC</tspan> service  ·  reproducible &amp; framework-agnostic
  </text>
  <text x="36" y="436" font-size="12.5" fill="#94a3b8">No lock-in: mix and match analysis libraries; MMFDB keeps every step traceable to the raw data.</text>
</svg>
