services:
  mmfdb:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MMFDB_ADMIN_PASSWORD: ${MMFDB_ADMIN_PASSWORD:-admin}
      MMFDB_CONFIG: /etc/mmfdb/mmfdb.yaml
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - mmfdb-data:/var/lib/mmfdb
      - ./mmfdb.compose.yaml:/etc/mmfdb/mmfdb.yaml:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mmfdb-data:
