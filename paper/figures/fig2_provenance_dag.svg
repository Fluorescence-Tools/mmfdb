<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 380" width="1120" height="380" role="img" aria-label="Provenance graph: one raw measurement analysed by two independent tools, each recorded as an operation">
  <defs>
    <marker id="ah2" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6068"/>
    </marker>
    <marker id="ah2d" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#98a1aa"/>
    </marker>
    <style>
      text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .pl { font-size: 23px; font-weight: 700; fill: #14181c; }
      .hd { font-size: 13.5px; font-weight: 700; fill: #6b7280; letter-spacing: 1.4px; }
      .nt { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 15px; font-weight: 600; fill: #14181c; }
      .kd { font-size: 13px; font-weight: 600; fill: #5a6068; }
      .bs { font-size: 13px; fill: #5a6068; }
      .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; fill: #7a8189; }
      .val { font-size: 13.5px; font-weight: 600; fill: #14181c; }
      .el { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; fill: #7a8189; }
      .lg { font-size: 13px; fill: #5a6068; }
      .art { fill: #eaf2fb; stroke: #2b6cb0; stroke-width: 1.5; }
      .op { fill: #fdf3e3; stroke: #a1620a; stroke-width: 1.5; }
      .gt { fill: #ffffff; stroke: #b8c0c9; stroke-width: 1.4; stroke-dasharray: 6 4; }
      .edge { stroke: #5a6068; stroke-width: 1.7; fill: none; }
      .cmp { stroke: #98a1aa; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; }
    </style>
  </defs>

  <text class="pl" x="14" y="30">b</text>
  <text class="hd" x="44" y="29">ONE MEASUREMENT, TWO INDEPENDENT TOOLS, ONE QUERYABLE GRAPH</text>

  <!-- raw artifact -->
  <rect class="art" x="24" y="140" width="190" height="100" rx="7"/>
  <text class="nt" x="40" y="168">raw/11939508</text>
  <text class="kd" x="40" y="189">raw_measurement</text>
  <text class="mono" x="40" y="208">sha256 &#8230; (checksummed)</text>
  <text class="bs" x="40" y="228">9 &#215; 10&#8309; simulated photons</text>

  <!-- edges: raw -> operations -->
  <path class="edge" d="M214,168 C248,168 250,96 278,96" marker-end="url(#ah2)"/>
  <path class="edge" d="M214,212 C248,212 250,272 278,272" marker-end="url(#ah2)"/>
  <text class="el" x="252" y="122" text-anchor="middle">input_to</text>
  <text class="el" x="252" y="252" text-anchor="middle">input_to</text>

  <!-- operation A -->
  <rect class="op" x="282" y="44" width="234" height="104" rx="7"/>
  <text class="nt" x="298" y="70">op/cli</text>
  <text class="kd" x="298" y="90">external_tool &#183; succeeded</text>
  <text class="bs" x="298" y="109">tttrlib-backed CLI, subprocess</text>
  <text class="mono" x="298" y="127">exit_code = 0</text>
  <text class="mono" x="298" y="143">min_photons = 20</text>

  <!-- operation B -->
  <rect class="op" x="282" y="220" width="234" height="104" rx="7"/>
  <text class="nt" x="298" y="246">op/fretbursts</text>
  <text class="kd" x="298" y="266">external_tool &#183; succeeded</text>
  <text class="bs" x="298" y="285">FRETBursts 0.8.3, in process</text>
  <text class="mono" x="298" y="303">exit_code = NULL</text>
  <text class="mono" x="298" y="319">F = 6, m = 10, size &#8805; 20</text>

  <!-- edges: operations -> results -->
  <path class="edge" d="M520,96 L572,96" marker-end="url(#ah2)"/>
  <path class="edge" d="M520,272 L572,272" marker-end="url(#ah2)"/>
  <text class="el" x="546" y="86" text-anchor="middle">produced</text>
  <text class="el" x="546" y="262" text-anchor="middle">produced</text>

  <!-- result artifacts -->
  <rect class="art" x="576" y="56" width="190" height="80" rx="7"/>
  <text class="nt" x="592" y="81">bursts/cli</text>
  <text class="kd" x="592" y="100">burst_table</text>
  <text class="val" x="592" y="122">3579 bursts &#183; E&#772; = 0.502</text>

  <rect class="art" x="576" y="232" width="190" height="80" rx="7"/>
  <text class="nt" x="592" y="257">bursts/fb</text>
  <text class="kd" x="592" y="276">burst_table</text>
  <text class="val" x="592" y="298">2647 bursts &#183; E&#772; = 0.504</text>

  <!-- comparison to ground truth -->
  <path class="cmp" d="M770,96 C796,96 792,150 808,166" marker-end="url(#ah2d)"/>
  <path class="cmp" d="M770,272 C796,272 792,218 808,202" marker-end="url(#ah2d)"/>

  <rect class="gt" x="812" y="132" width="272" height="104" rx="7"/>
  <text class="kd" x="828" y="158">Simulated ground truth</text>
  <text class="val" x="828" y="180">mean E = 0.500</text>
  <text class="bs" x="828" y="202">Both tools recover it to within 0.5 %,</text>
  <text class="bs" x="828" y="220">and the graph records which is which.</text>

  <!-- legend -->
  <rect class="art" x="24" y="344" width="16" height="16" rx="3"/>
  <text class="lg" x="48" y="357">artifact (data node)</text>

  <rect class="op" x="204" y="344" width="16" height="16" rx="3"/>
  <text class="lg" x="228" y="357">operation (one tool run)</text>

  <path class="edge" d="M420,352 L452,352" marker-end="url(#ah2)"/>
  <text class="lg" x="462" y="357">typed provenance edge</text>

  <path class="cmp" d="M636,352 L668,352" marker-end="url(#ah2d)"/>
  <text class="lg" x="678" y="357">comparison drawn here, not stored</text>
</svg>
