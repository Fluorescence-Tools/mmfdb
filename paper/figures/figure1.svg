<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1136" width="1120" height="1136" role="img" aria-label="MMFDB: architecture, provenance graph, and deposition formats">
  <title>Figure 1 | MMFDB architecture, provenance model, and deposition</title>
  <defs>
<marker id="p1-ah" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6068"/>
    </marker>
<marker id="p2-ah2" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6068"/>
    </marker>
    <marker id="p2-ah2d" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#98a1aa"/>
    </marker>
<marker id="p3-ah3" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6068"/>
    </marker>
    <marker id="p3-ah3s" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6068"/>
    </marker>
    <style>
/* fig1_architecture.svg */
text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .p1-pl { font-size: 23px; font-weight: 700; fill: #14181c; }
      .p1-hd { font-size: 13.5px; font-weight: 700; fill: #6b7280; letter-spacing: 1.4px; }
      .p1-bt { font-size: 16px; font-weight: 600; fill: #14181c; }
      .p1-bs { font-size: 13px; fill: #5a6068; }
      .p1-mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12.5px; fill: #5a6068; }
      .p1-fn { font-size: 12.5px; fill: #7a8189; font-style: italic; }
      .p1-box { fill: #ffffff; stroke: #c3cad2; stroke-width: 1.3; }
      .p1-core { fill: #f7f8fa; stroke: #b8c0c9; stroke-width: 1.4; stroke-dasharray: 6 4; }
      .p1-store { fill: #eaf2fb; stroke: #2b6cb0; stroke-width: 1.4; }
      .p1-sch { fill: #f1ecfb; stroke: #6b46c1; stroke-width: 1.4; }
      .p1-prov { fill: #fdf3e3; stroke: #a1620a; stroke-width: 1.4; }
      .p1-edge { stroke: #5a6068; stroke-width: 1.6; fill: none; }
/* fig2_provenance_dag.svg */
text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .p2-pl { font-size: 23px; font-weight: 700; fill: #14181c; }
      .p2-hd { font-size: 13.5px; font-weight: 700; fill: #6b7280; letter-spacing: 1.4px; }
      .p2-nt { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 15px; font-weight: 600; fill: #14181c; }
      .p2-kd { font-size: 13px; font-weight: 600; fill: #5a6068; }
      .p2-bs { font-size: 13px; fill: #5a6068; }
      .p2-mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; fill: #7a8189; }
      .p2-val { font-size: 13.5px; font-weight: 600; fill: #14181c; }
      .p2-el { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; fill: #7a8189; }
      .p2-lg { font-size: 13px; fill: #5a6068; }
      .p2-art { fill: #eaf2fb; stroke: #2b6cb0; stroke-width: 1.5; }
      .p2-op { fill: #fdf3e3; stroke: #a1620a; stroke-width: 1.5; }
      .p2-gt { fill: #ffffff; stroke: #b8c0c9; stroke-width: 1.4; stroke-dasharray: 6 4; }
      .p2-edge { stroke: #5a6068; stroke-width: 1.7; fill: none; }
      .p2-cmp { stroke: #98a1aa; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; }
/* fig3_deposit_flow.svg */
text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .p3-pl { font-size: 23px; font-weight: 700; fill: #14181c; }
      .p3-hd { font-size: 13.5px; font-weight: 700; fill: #6b7280; letter-spacing: 1.4px; }
      .p3-bt { font-size: 15px; font-weight: 600; fill: #14181c; }
      .p3-bs { font-size: 12.5px; fill: #5a6068; }
      .p3-mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12.5px; fill: #5a6068; }
      .p3-monob { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 13.5px; font-weight: 600; fill: #14181c; }
      .p3-yaml { fill: #ffffff; stroke: #c3cad2; stroke-width: 1.3; }
      .p3-run { fill: #fdf3e3; stroke: #a1620a; stroke-width: 1.5; }
      .p3-fmt { fill: #f1ecfb; stroke: #6b46c1; stroke-width: 1.4; }
      .p3-cons { fill: #e9f5ee; stroke: #2f7a52; stroke-width: 1.4; }
      .p3-edge { stroke: #5a6068; stroke-width: 1.7; fill: none; }
      .p3-spine { stroke: #5a6068; stroke-width: 1.4; fill: none; }
    </style>
  </defs>
  <rect x="0" y="0" width="1120" height="1136" fill="none"/>
<g transform="translate(0,0)">
<text class="p1-pl" x="14" y="30">a</text>

  <text class="p1-hd" x="150" y="58" text-anchor="middle">ACCESS</text>
  <text class="p1-hd" x="560" y="58" text-anchor="middle">CORE &#183; HOST-NEUTRAL</text>
  <text class="p1-hd" x="970" y="58" text-anchor="middle">BACKENDS</text>

  <!-- Access column -->
  <rect class="p1-box" x="40" y="78" width="220" height="46" rx="6"/>
  <text class="p1-bt" x="54" y="97">Embedded</text>
  <text class="p1-mono" x="54" y="114">MFDatabase (SQLite file)</text>

  <rect class="p1-box" x="40" y="132" width="220" height="46" rx="6"/>
  <text class="p1-bt" x="54" y="151">JSON-RPC 2.0 / HTTP</text>
  <text class="p1-mono" x="54" y="168">POST /rpc &#183; /objects</text>

  <rect class="p1-box" x="40" y="186" width="220" height="46" rx="6"/>
  <text class="p1-bt" x="54" y="205">Command line</text>
  <text class="p1-mono" x="54" y="222">mmfdb &#183; mmfdb-admin</text>

  <rect class="p1-box" x="40" y="240" width="220" height="46" rx="6"/>
  <text class="p1-bt" x="54" y="259">Web administrator</text>
  <text class="p1-bs" x="54" y="276">browser curation UI</text>

  <path class="p1-edge" d="M264,182 L322,182" marker-end="url(#p1-ah)"/>

  <!-- Core -->
  <rect class="p1-core" x="330" y="70" width="460" height="240" rx="10"/>

  <rect class="p1-store" x="350" y="86" width="420" height="64" rx="6"/>
  <text class="p1-bt" x="366" y="112">Content-addressed object store</text>
  <text class="p1-bs" x="366" y="132">MD5 routing + SHA-256 verification &#183; deduplicated &#183; native files kept verbatim</text>

  <rect class="p1-sch" x="350" y="156" width="420" height="64" rx="6"/>
  <text class="p1-bt" x="366" y="182">Dictionary-derived schema</text>
  <text class="p1-bs" x="366" y="202">PDBx/mmCIF + IHM + FLR dictionaries &#8594; SQL tables and vocabularies</text>

  <rect class="p1-prov" x="350" y="226" width="420" height="64" rx="6"/>
  <text class="p1-bt" x="366" y="252">Provenance DAG</text>
  <text class="p1-bs" x="366" y="272">artifact &#8212;input_to&#8594; operation &#8212;produced&#8594; artifact</text>

  <path class="p1-edge" d="M794,182 L852,182" marker-end="url(#p1-ah)"/>

  <!-- Backends -->
  <rect class="p1-box" x="860" y="78" width="220" height="46" rx="6"/>
  <text class="p1-bt" x="874" y="97">SQLite</text>
  <text class="p1-bs" x="874" y="114">zero-configuration default</text>

  <rect class="p1-box" x="860" y="132" width="220" height="46" rx="6"/>
  <text class="p1-bt" x="874" y="151">PostgreSQL</text>
  <text class="p1-bs" x="874" y="168">shared deployments</text>

  <rect class="p1-box" x="860" y="186" width="220" height="46" rx="6"/>
  <text class="p1-bt" x="874" y="205">Local FS &#183; S3</text>
  <text class="p1-bs" x="874" y="222">object payloads</text>

  <rect class="p1-box" x="860" y="240" width="220" height="46" rx="6"/>
  <text class="p1-bt" x="874" y="259">Local &#183; LDAP</text>
  <text class="p1-bs" x="874" y="276">authentication</text>

  <text class="p1-fn" x="330" y="330">No module under src/mmfdb imports a consumer application &#8212; enforced as a test, so any analysis tool can be a client.</text>
</g>
<g transform="translate(0,370)">
<text class="p2-pl" x="14" y="30">b</text>
  <text class="p2-hd" x="44" y="29">ONE MEASUREMENT, TWO INDEPENDENT TOOLS, ONE QUERYABLE GRAPH</text>

  <!-- raw artifact -->
  <rect class="p2-art" x="24" y="140" width="190" height="100" rx="7"/>
  <text class="p2-nt" x="40" y="168">raw/11939508</text>
  <text class="p2-kd" x="40" y="189">raw_measurement</text>
  <text class="p2-mono" x="40" y="208">sha256 &#8230; (checksummed)</text>
  <text class="p2-bs" x="40" y="228">9 &#215; 10&#8309; simulated photons</text>

  <!-- edges: raw -> operations -->
  <path class="p2-edge" d="M214,168 C248,168 250,96 278,96" marker-end="url(#p2-ah2)"/>
  <path class="p2-edge" d="M214,212 C248,212 250,272 278,272" marker-end="url(#p2-ah2)"/>
  <text class="p2-el" x="252" y="122" text-anchor="middle">input_to</text>
  <text class="p2-el" x="252" y="252" text-anchor="middle">input_to</text>

  <!-- operation A -->
  <rect class="p2-op" x="282" y="44" width="234" height="104" rx="7"/>
  <text class="p2-nt" x="298" y="70">op/cli</text>
  <text class="p2-kd" x="298" y="90">external_tool &#183; succeeded</text>
  <text class="p2-bs" x="298" y="109">tttrlib-backed CLI, subprocess</text>
  <text class="p2-mono" x="298" y="127">exit_code = 0</text>
  <text class="p2-mono" x="298" y="143">min_photons = 20</text>

  <!-- operation B -->
  <rect class="p2-op" x="282" y="220" width="234" height="104" rx="7"/>
  <text class="p2-nt" x="298" y="246">op/fretbursts</text>
  <text class="p2-kd" x="298" y="266">external_tool &#183; succeeded</text>
  <text class="p2-bs" x="298" y="285">FRETBursts 0.8.3, in process</text>
  <text class="p2-mono" x="298" y="303">exit_code = NULL</text>
  <text class="p2-mono" x="298" y="319">F = 6, m = 10, size &#8805; 20</text>

  <!-- edges: operations -> results -->
  <path class="p2-edge" d="M520,96 L572,96" marker-end="url(#p2-ah2)"/>
  <path class="p2-edge" d="M520,272 L572,272" marker-end="url(#p2-ah2)"/>
  <text class="p2-el" x="546" y="86" text-anchor="middle">produced</text>
  <text class="p2-el" x="546" y="262" text-anchor="middle">produced</text>

  <!-- result artifacts -->
  <rect class="p2-art" x="576" y="56" width="190" height="80" rx="7"/>
  <text class="p2-nt" x="592" y="81">bursts/cli</text>
  <text class="p2-kd" x="592" y="100">burst_table</text>
  <text class="p2-val" x="592" y="122">3579 bursts &#183; E&#772; = 0.502</text>

  <rect class="p2-art" x="576" y="232" width="190" height="80" rx="7"/>
  <text class="p2-nt" x="592" y="257">bursts/fb</text>
  <text class="p2-kd" x="592" y="276">burst_table</text>
  <text class="p2-val" x="592" y="298">2647 bursts &#183; E&#772; = 0.504</text>

  <!-- comparison to ground truth -->
  <path class="p2-cmp" d="M770,96 C796,96 792,150 808,166" marker-end="url(#p2-ah2d)"/>
  <path class="p2-cmp" d="M770,272 C796,272 792,218 808,202" marker-end="url(#p2-ah2d)"/>

  <rect class="p2-gt" x="812" y="132" width="272" height="104" rx="7"/>
  <text class="p2-kd" x="828" y="158">Simulated ground truth</text>
  <text class="p2-val" x="828" y="180">mean E = 0.500</text>
  <text class="p2-bs" x="828" y="202">Both tools recover it to within 0.5 %,</text>
  <text class="p2-bs" x="828" y="220">and the graph records which is which.</text>

  <!-- legend -->
  <rect class="p2-art" x="24" y="344" width="16" height="16" rx="3"/>
  <text class="p2-lg" x="48" y="357">artifact (data node)</text>

  <rect class="p2-op" x="204" y="344" width="16" height="16" rx="3"/>
  <text class="p2-lg" x="228" y="357">operation (one tool run)</text>

  <path class="p2-edge" d="M420,352 L452,352" marker-end="url(#p2-ah2)"/>
  <text class="p2-lg" x="462" y="357">typed provenance edge</text>

  <path class="p2-cmp" d="M636,352 L668,352" marker-end="url(#p2-ah2d)"/>
  <text class="p2-lg" x="678" y="357">comparison drawn here, not stored</text>
</g>
<g transform="translate(0,776)">
<text class="p3-pl" x="14" y="30">c</text>

  <text class="p3-hd" x="126" y="52" text-anchor="middle">DECLARE</text>
  <text class="p3-hd" x="361" y="52" text-anchor="middle">RUN</text>
  <text class="p3-hd" x="621" y="52" text-anchor="middle">PUBLISH</text>
  <text class="p3-hd" x="943" y="52" text-anchor="middle">READ BY</text>

  <!-- workflow.yaml -->
  <rect class="p3-yaml" x="24" y="64" width="204" height="210" rx="6"/>
  <text class="p3-monob" x="40" y="88">workflow.yaml</text>
  <text class="p3-mono" x="40" y="112">sources:</text>
  <text class="p3-mono" x="40" y="131">  photons: {path: &#8230;}</text>
  <text class="p3-mono" x="40" y="150">steps:</text>
  <text class="p3-mono" x="40" y="169">  - id: bursts</text>
  <text class="p3-mono" x="40" y="188">    cmd: tool.py &#8230;</text>
  <text class="p3-mono" x="40" y="207">    outputs: {&#8230;}</text>
  <text class="p3-mono" x="40" y="226">publish:</text>
  <text class="p3-mono" x="40" y="245">  formats: [cif]</text>

  <path class="p3-edge" d="M232,170 L264,170" marker-end="url(#p3-ah3)"/>

  <!-- runner -->
  <rect class="p3-run" x="268" y="118" width="186" height="104" rx="6"/>
  <text class="p3-monob" x="284" y="144">mmfdb workflow run</text>
  <text class="p3-bs" x="284" y="165">cmd: subprocess, or</text>
  <text class="p3-bs" x="284" y="183">python: in-process call</text>
  <text class="p3-bs" x="284" y="205">each step &#8594; one operation</text>

  <!-- fan into formats -->
  <path class="p3-edge" d="M458,170 L478,170"/>
  <path class="p3-spine" d="M480,88 L480,312"/>
  <path class="p3-spine" d="M480,88 L490,88" marker-end="url(#p3-ah3s)"/>
  <path class="p3-spine" d="M480,144 L490,144" marker-end="url(#p3-ah3s)"/>
  <path class="p3-spine" d="M480,200 L490,200" marker-end="url(#p3-ah3s)"/>
  <path class="p3-spine" d="M480,256 L490,256" marker-end="url(#p3-ah3s)"/>
  <path class="p3-spine" d="M480,312 L490,312" marker-end="url(#p3-ah3s)"/>

  <!-- publish formats -->
  <rect class="p3-fmt" x="496" y="64" width="250" height="48" rx="5"/>
  <text class="p3-monob" x="510" y="85">&lt;name&gt;.deposit.cif</text>
  <text class="p3-bs" x="510" y="103">self-contained mmCIF, data embedded</text>

  <rect class="p3-fmt" x="496" y="120" width="250" height="48" rx="5"/>
  <text class="p3-monob" x="510" y="141">&lt;name&gt;.zip</text>
  <text class="p3-bs" x="510" y="159">files + checksummed manifest</text>

  <rect class="p3-fmt" x="496" y="176" width="250" height="48" rx="5"/>
  <text class="p3-monob" x="510" y="197">&lt;name&gt;_archive.zip</text>
  <text class="p3-bs" x="510" y="215">the above + SQLite snapshot</text>

  <rect class="p3-fmt" x="496" y="232" width="250" height="48" rx="5"/>
  <text class="p3-monob" x="510" y="253">&lt;name&gt;.cif</text>
  <text class="p3-bs" x="510" y="271">FLR metadata only</text>

  <rect class="p3-fmt" x="496" y="288" width="250" height="48" rx="5"/>
  <text class="p3-monob" x="510" y="309">&lt;name&gt;_methods.md</text>
  <text class="p3-bs" x="510" y="327">generated methods section</text>

  <path class="p3-edge" d="M750,200 L782,200" marker-end="url(#p3-ah3)"/>

  <!-- consumers -->
  <rect class="p3-cons" x="790" y="64" width="306" height="76" rx="6"/>
  <text class="p3-bt" x="806" y="89">Any mmCIF reader</text>
  <text class="p3-bs" x="806" y="110">python-ihm, gemmi &#8212; no MMFDB and no</text>
  <text class="p3-bs" x="806" y="128">database needed to read a deposit</text>

  <rect class="p3-cons" x="790" y="156" width="306" height="76" rx="6"/>
  <text class="p3-bt" x="806" y="181">Zenodo / OSF</text>
  <text class="p3-bs" x="806" y="202">one file to deposit; extract recovers</text>
  <text class="p3-bs" x="806" y="220">every input byte-for-byte, plus the YAML</text>

  <rect class="p3-cons" x="790" y="248" width="306" height="76" rx="6"/>
  <text class="p3-bt" x="806" y="273">Another MMFDB instance</text>
  <text class="p3-bs" x="806" y="294">full re-import currently requires the</text>
  <text class="p3-bs" x="806" y="312">archive format&#8217;s database snapshot</text>
</g>
</svg>
