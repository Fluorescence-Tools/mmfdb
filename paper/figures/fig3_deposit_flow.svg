<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" width="1120" height="360" role="img" aria-label="From a YAML workflow to publication formats readable without MMFDB">
  <defs>
    <marker id="ah3" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6068"/>
    </marker>
    <marker id="ah3s" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6068"/>
    </marker>
    <style>
      text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .pl { font-size: 23px; font-weight: 700; fill: #14181c; }
      .hd { font-size: 13.5px; font-weight: 700; fill: #6b7280; letter-spacing: 1.4px; }
      .bt { font-size: 15px; font-weight: 600; fill: #14181c; }
      .bs { font-size: 12.5px; fill: #5a6068; }
      .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12.5px; fill: #5a6068; }
      .monob { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 13.5px; font-weight: 600; fill: #14181c; }
      .yaml { fill: #ffffff; stroke: #c3cad2; stroke-width: 1.3; }
      .run { fill: #fdf3e3; stroke: #a1620a; stroke-width: 1.5; }
      .fmt { fill: #f1ecfb; stroke: #6b46c1; stroke-width: 1.4; }
      .cons { fill: #e9f5ee; stroke: #2f7a52; stroke-width: 1.4; }
      .edge { stroke: #5a6068; stroke-width: 1.7; fill: none; }
      .spine { stroke: #5a6068; stroke-width: 1.4; fill: none; }
    </style>
  </defs>

  <text class="pl" x="14" y="30">c</text>

  <text class="hd" x="126" y="52" text-anchor="middle">DECLARE</text>
  <text class="hd" x="361" y="52" text-anchor="middle">RUN</text>
  <text class="hd" x="621" y="52" text-anchor="middle">PUBLISH</text>
  <text class="hd" x="943" y="52" text-anchor="middle">READ BY</text>

  <!-- workflow.yaml -->
  <rect class="yaml" x="24" y="64" width="204" height="210" rx="6"/>
  <text class="monob" x="40" y="88">workflow.yaml</text>
  <text class="mono" x="40" y="112">sources:</text>
  <text class="mono" x="40" y="131">  photons: {path: &#8230;}</text>
  <text class="mono" x="40" y="150">steps:</text>
  <text class="mono" x="40" y="169">  - id: bursts</text>
  <text class="mono" x="40" y="188">    cmd: tool.py &#8230;</text>
  <text class="mono" x="40" y="207">    outputs: {&#8230;}</text>
  <text class="mono" x="40" y="226">publish:</text>
  <text class="mono" x="40" y="245">  formats: [cif]</text>

  <path class="edge" d="M232,170 L264,170" marker-end="url(#ah3)"/>

  <!-- runner -->
  <rect class="run" x="268" y="118" width="186" height="104" rx="6"/>
  <text class="monob" x="284" y="144">mmfdb workflow run</text>
  <text class="bs" x="284" y="165">cmd: subprocess, or</text>
  <text class="bs" x="284" y="183">python: in-process call</text>
  <text class="bs" x="284" y="205">each step &#8594; one operation</text>

  <!-- fan into formats -->
  <path class="edge" d="M458,170 L478,170"/>
  <path class="spine" d="M480,88 L480,312"/>
  <path class="spine" d="M480,88 L490,88" marker-end="url(#ah3s)"/>
  <path class="spine" d="M480,144 L490,144" marker-end="url(#ah3s)"/>
  <path class="spine" d="M480,200 L490,200" marker-end="url(#ah3s)"/>
  <path class="spine" d="M480,256 L490,256" marker-end="url(#ah3s)"/>
  <path class="spine" d="M480,312 L490,312" marker-end="url(#ah3s)"/>

  <!-- publish formats -->
  <rect class="fmt" x="496" y="64" width="250" height="48" rx="5"/>
  <text class="monob" x="510" y="85">&lt;name&gt;.deposit.cif</text>
  <text class="bs" x="510" y="103">self-contained mmCIF, data embedded</text>

  <rect class="fmt" x="496" y="120" width="250" height="48" rx="5"/>
  <text class="monob" x="510" y="141">&lt;name&gt;.zip</text>
  <text class="bs" x="510" y="159">files + checksummed manifest</text>

  <rect class="fmt" x="496" y="176" width="250" height="48" rx="5"/>
  <text class="monob" x="510" y="197">&lt;name&gt;_archive.zip</text>
  <text class="bs" x="510" y="215">the above + SQLite snapshot</text>

  <rect class="fmt" x="496" y="232" width="250" height="48" rx="5"/>
  <text class="monob" x="510" y="253">&lt;name&gt;.cif</text>
  <text class="bs" x="510" y="271">FLR metadata only</text>

  <rect class="fmt" x="496" y="288" width="250" height="48" rx="5"/>
  <text class="monob" x="510" y="309">&lt;name&gt;_methods.md</text>
  <text class="bs" x="510" y="327">generated methods section</text>

  <path class="edge" d="M750,200 L782,200" marker-end="url(#ah3)"/>

  <!-- consumers -->
  <rect class="cons" x="790" y="64" width="306" height="76" rx="6"/>
  <text class="bt" x="806" y="89">Any mmCIF reader</text>
  <text class="bs" x="806" y="110">python-ihm, gemmi &#8212; no MMFDB and no</text>
  <text class="bs" x="806" y="128">database needed to read a deposit</text>

  <rect class="cons" x="790" y="156" width="306" height="76" rx="6"/>
  <text class="bt" x="806" y="181">Zenodo / OSF</text>
  <text class="bs" x="806" y="202">one file to deposit; extract recovers</text>
  <text class="bs" x="806" y="220">every input byte-for-byte, plus the YAML</text>

  <rect class="cons" x="790" y="248" width="306" height="76" rx="6"/>
  <text class="bt" x="806" y="273">Another MMFDB instance</text>
  <text class="bs" x="806" y="294">full re-import currently requires the</text>
  <text class="bs" x="806" y="312">archive format&#8217;s database snapshot</text>
</svg>
